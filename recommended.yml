# Curated list of add-ons recommended for sites built with Ágora Transparency
# (drupal/agora_transparency), readable by Project Browser. The file is
# intentionally empty for now: Ágora recommends nothing yet.
#
# It will be filled when there is something to recommend — the first entry is
# expected to be an AI provider, which Ágora deliberately does not depend on, so
# that the template installs and works without an API key.
#
# Rules for anything added here:
#   - Stable, supported releases only. No dev, alpha, beta or release candidate:
#     most Drupal projects only allow stable releases, so an unstable entry is
#     not installable by end users.
#   - Every entry needs its justification recorded in the project's decision log
#     before it is listed.
#
# Entry format, keyed by Composer package name:
#
# drupal/example:
#   title: 'Example Project'
#   type: module
#   logo: null
#   core: '^11'
#   machineName: example
#   body:
#     summary: 'A short description of the project.'
#   packageName: drupal/example
#
# Consuming this list also requires installing `project_browser` and pointing
# `project_browser.admin_settings` at a permanent URL for this file, in
# `recipe.yml`. Neither is done yet.
