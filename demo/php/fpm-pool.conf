; Agora demo: the only PHP-FPM configuration in the image. The image's own
; www.conf, docker.conf and zz-docker.conf are removed by the Dockerfile.
;
; The FPM master runs as www-data (compose.yaml "user:"), so it never has root
; and there is no user/group switch to configure.

[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
listen = 9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
request_terminate_timeout = 60s

; nginx asks for this path to check that FPM answers (web healthcheck).
ping.path = /fpm-ping
ping.response = pong

; Worker output goes to the container log. nginx already logs every request,
; so FPM keeps no access log of its own.
catch_workers_output = yes
decorate_workers_output = no

; Workers see only the variables settings.php reads, nothing else from the
; container's environment.
clear_env = yes
env[DB_HOST] = $DB_HOST
env[DB_NAME] = $DB_NAME
env[DB_USER] = $DB_USER
env[DB_PASSWORD] = $DB_PASSWORD
env[DRUPAL_HASH_SALT] = $DRUPAL_HASH_SALT
env[DEMO_HOSTNAME] = $DEMO_HOSTNAME
env[EDGE_SUBNET] = $EDGE_SUBNET
env[DRUPAL_CMS_TELEMETRY] = $DRUPAL_CMS_TELEMETRY
env[TMPDIR] = /tmp

security.limit_extensions = .php

; Web requests may not start programs. This applies to FPM workers only: the
; command-line PHP that runs drush keeps these functions.
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec
php_admin_value[memory_limit] = 256M
php_admin_flag[session.upload_progress.enabled] = off
php_admin_flag[display_errors] = off
php_admin_flag[allow_url_include] = off
