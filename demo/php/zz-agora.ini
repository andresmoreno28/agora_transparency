; Agora demo: PHP settings shared by PHP-FPM and the command line (drush).
; The FPM pool (fpm-pool.conf) tightens some of them for web requests only.

; Do not announce PHP in response headers.
expose_php = Off

; Upload progress tracking stays off: the demo accepts no uploads, and the
; feature reads attacker-controlled session data.
session.upload_progress.enabled = Off

; drush site:install of Drupal CMS needs more than PHP's default 128M. The FPM
; pool lowers this to 256M for web requests.
memory_limit = 1G
max_execution_time = 60

; Errors go to the container log, never to a page.
display_errors = Off
display_startup_errors = Off
log_errors = On
zend.exception_ignore_args = On

; The code in the image never changes while a container runs, so OPcache never
; needs to look at file timestamps. A new image means a new container and an
; empty cache.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; No uploads in the demo.
upload_max_filesize = 2M
post_max_size = 8M
allow_url_include = Off
