# Rehearsal trap: logs every connection attempt and answers nothing useful.
# Each logged line starts with "TRAP", which rehearse.sh counts.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

stream {
    log_format trap 'TRAP tls $time_iso8601 from=$remote_addr sni=$ssl_preread_server_name';
    server {
        listen 443;
        ssl_preread on;
        access_log /dev/stdout trap;
        return "trap\n";
    }
}

http {
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    log_format trap 'TRAP http $time_iso8601 from=$remote_addr host=$host "$request"';
    access_log /dev/stdout trap;
    server {
        listen 80 default_server;
        return 444;
    }
}
