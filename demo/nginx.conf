# Agora demo: nginx in front of PHP-FPM.
#
# Runs as uid 101 on a read-only filesystem: everything nginx writes goes to
# /tmp (a tmpfs). It listens on 8080 inside the container only; no port is
# published on the host. The only client that can reach it is cloudflared, on
# the "edge" network.

worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # No visitor addresses are kept: the log line starts with "-" instead of CF-Connecting-IP.
    log_format demo '- [$time_local] "$request" $status '
                    '$body_bytes_sent "$http_referer" "$http_user_agent" $request_time';
    access_log /dev/stdout demo;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json text/plain;

    server {
        listen 8080 default_server;
        server_name _;
        root /opt/drupal/web;
        index index.php;

        # A demonstration of a fictional municipality: keep it out of search
        # results. Delete this line to let search engines index the demo.
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Health check: nginx and PHP-FPM both answer. Only from inside this
        # container (the healthcheck); 403 for everybody else.
        location = /fpm-ping {
            allow 127.0.0.1;
            deny all;
            access_log off;
            include fastcgi_params;
            fastcgi_param SCRIPT_NAME /fpm-ping;
            fastcgi_param SCRIPT_FILENAME /fpm-ping;
            fastcgi_pass php:9000;
        }

        # ------------------------------------------------------------------
        # Administration and accounts are never reachable from outside.
        # Drupal matches paths case-insensitively, so these do too (~*). An
        # optional two-letter language prefix is covered as well. nginx tests
        # the decoded, normalised path, so /%61dmin, //admin and /./admin are
        # caught like /admin. Administration happens only through
        # "docker compose exec php drush ...".
        #   /admin...                       every administration page
        #   /user, /user/...                sign-in, password, registration, accounts
        #   /canvas, /batch, /cron          the page editor, batch runner, cron URL
        #   /node/add..., /media/add...     content creation
        #   /<anything>/edit, /delete, ...  every entity operation
        # ------------------------------------------------------------------
        location ~* "^/([a-z]{2}(-[a-z]{2,4})?/)?admin" { return 404; }
        location ~* "^/([a-z]{2}(-[a-z]{2,4})?/)?(user|canvas|batch|cron)(/|$)" { return 404; }
        location ~* "^/([a-z]{2}(-[a-z]{2,4})?/)?(node|media)/add" { return 404; }
        location ~* "^/.+/(edit|delete|revisions|translations|latest|layout)(/|$)" { return 404; }

        # Drupal's front controller is reachable only through the internal
        # redirects below, never by name. Every other PHP file - install.php,
        # update.php, authorize.php, rebuild.php - and every /index.php/...
        # path answers 404 and never reaches PHP.
        location = /index.php {
            internal;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /opt/drupal/web/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /opt/drupal/web;
            fastcgi_param HTTP_PROXY "";
            # Drupal never learns the visitor's address (nothing here needs it: sign-in and admin
            # are blocked); it sees cloudflared's internal address. X-Forwarded-Proto still passes.
            fastcgi_param HTTP_X_FORWARDED_FOR "";
            fastcgi_read_timeout 60s;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
            fastcgi_pass php:9000;
        }
        location ~* \.php(/|$) { return 404; }

        # Hidden files and source files are never served.
        location ~ (^|/)\.(?!well-known/) { return 404; }
        location ~* \.(engine|inc|install|make|module|profile|po|sh|sql|theme|twig|tpl|xtmpl|yml|yaml|lock|dist)$ { return 404; }
        location ~* (^|/)(composer\.json|package\.json|web\.config)$ { return 404; }

        # Aggregated CSS/JS and image derivatives are generated by Drupal the
        # first time they are asked for.
        location ~ ^/sites/default/files/(css|js|styles)/ {
            try_files $uri @drupal;
            expires 7d;
            access_log off;
        }

        # Private files go through Drupal's access checks.
        location ~ ^/system/files/ {
            try_files /nonexistent @drupal;
        }

        location ~* \.(css|js|mjs|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot)$ {
            try_files $uri @drupal;
            expires 7d;
            access_log off;
        }

        location / {
            try_files $uri /index.php?$query_string;
        }

        # The query string is carried over by rewrite itself.
        location @drupal {
            rewrite ^ /index.php last;
        }
    }
}
# cspell:ignore dmin
