# The governance auditor (T-0511, D-059).
#
# WHY THIS ROLE EXISTS AT ALL. Config Guardian's dashboard is reachable with
# `view config snapshots`, a permission an administrator already holds. Shipping
# no role would therefore lose nothing technically and everything in product
# terms: "the portal audits its own configuration" is only a transparency claim
# if somebody who is NOT the administrator can witness the audit. This role is
# that somebody - an internal auditor, a clerk of the council, a secretary who
# has to be able to say when a setting changed and by how much, and who must not
# be able to change one.
#
# EXACTLY TWO PERMISSIONS, AND THE ABSENCES ARE THE DESIGN.
# `config_guardian.permissions.yml` in 1.1.0 declares EIGHT permissions, SIX of
# them `restrict access: true`. This role holds one of the two unrestricted ones
# and ONE of the six restricted ones, by name and on purpose (D-081, ruling 3):
#
#   held      view config snapshots    RESTRICTED from 1.1.0, held as the named
#                                      exception: the dashboard, snapshot list,
#                                      comparison and activity log
#   held      analyze config impact    impact analysis and the dependency graph
#
#   NOT held  create config snapshots      unrestricted, and still declined - see below
#   NOT held  administer config guardian   restricted
#   NOT held  restore config snapshots     restricted
#   NOT held  delete config snapshots      restricted
#   NOT held  export config snapshots      restricted from 1.1.0
#   NOT held  import config snapshots      restricted
#   NOT held  synchronize configuration    restricted, core `config`
#   NOT held  export configuration         restricted, core `config`
#   NOT held  import configuration         restricted, core `config`
#
# WARNING: `view config snapshots` IS RESTRICTED BECAUSE A COMPARISON SHOWS
# CONFIGURATION VALUES, and that is the one thing this role must be trusted
# with. What keeps it safe to hand to an auditor is that the configuration that
# holds credentials is not in the snapshots at all: `config_guardian.settings.yml`
# excludes it by name, and D-081 lists what was measured.
#
# WARNING: THE DECLINED UNRESTRICTED PERMISSION IS THE INTERESTING HALF, because
# granting it would have been free and defensible-looking. `create config
# snapshots` writes a row to a database table on demand. Manual snapshots are
# never pruned, so it cannot push the automatic history out of the table; but an
# auditor who can write the store they audit is no longer only reading it, and
# least privilege here is also evidence integrity.
#
# The permission set is asserted for EQUALITY, not containment, by
# `tests/src/Kernel/RolesAndPermissionsTest.php`, which also asserts that this
# role holds none of the restricted permissions LISTED BY NAME except the
# exception, and that the list equals the set read from the installed module's
# own permissions file - so a restricted permission added upstream fails there
# instead of slipping in unnoticed, and a permission that accretes onto this
# role fails as loudly as one that goes missing.
langcode: en
status: true
dependencies:
  module:
    # Both permissions below are defined by `config_guardian`. Without the
    # module the role does not import and a clean install loses it silently -
    # the I-086 shape. The module is declared in `recipe.yml`'s `install:`
    # under the `governance` area, which `RecipeRunner` processes before it
    # creates this recipe's own config, so the dependency is satisfied.
    - config_guardian
id: agora_governance_auditor
label: 'Governance auditor'
weight: 6
is_admin: false
permissions:
  - 'analyze config impact'
  - 'view config snapshots'
