    -
      value: 'How accessible this site is, what has been tested and what has not, and how to report a barrier.'
  field_content:
    -
      value: '<p><strong>This statement is a starting point, not a finished document.</strong> Before publishing it, the body operating this site must complete the sections marked <em>To be completed</em>: its own name, the date of its own review, and a contact route a member of the public can actually use. Everything else on this page describes the site template as it is shipped, and every claim below names the check that produced it.</p><h2>What this statement covers</h2><p>It covers the pages this site serves to the public: the front page, the registers of contracts, grants, agreements, documents, datasets and people, the record page of each entry in those registers, and the document library.</p><p>It does not cover the administrative interface, which is Drupal core, nor any page, file or embedded service added to the site after installation.</p><h2>Conformance status</h2><p>The target is the <strong>Web Content Accessibility Guidelines (WCAG) 2.2, level AA</strong>.</p><p><strong>No claim of full conformance is made here.</strong> This site has not been audited end to end by an independent evaluator, and no automated test suite can establish conformance on its own. What has been verified is listed below, and what has not been verified is listed beside it. A body that needs a conformance claim needs an evaluation of its own site, carrying its own content.</p><h2>What is verified automatically, on every change</h2><p>These checks run in the continuous integration of the site template and block a release when they fail. The figures are those reported by the most recent run at the time this text was written.</p><ul><li><strong>Automated accessibility testing.</strong> axe-core runs over six representative page types: two hand-built data tables, a view rendering a real table, a prose page, a content record page and the core sign-in form. Result: <strong>89 rules applied per page, 0 violations</strong>. The number of rules actually applied is recorded for each page rather than assumed, because a rule that never ran cannot have passed.</li><li><strong>Colour contrast.</strong> Every foreground and background pair declared in the colour tokens of the theme is measured against the threshold that pair declares. Result: <strong>67 pairs checked, 0 below threshold</strong>.</li><li><strong>Data tables.</strong> Every table the template renders carries a caption naming what the table holds, and header cells marked as headers, so that a screen reader can announce the row and the column a figure belongs to. A table too wide for the screen sits inside a scrolling region that can be reached and moved with the keyboard alone.</li><li><strong>Page structure.</strong> Each page carries exactly one first-level heading, asserted as exactly one: a page with none and a page with two are both defects, and a check that accepts <em>at least one</em> hides the second.</li><li><strong>Bypassing the navigation.</strong> A skip link is the first thing the keyboard reaches on every page, and it moves focus to the start of the main content.</li></ul><h2>What automated testing does not check</h2><p>Automated tools find only a part of the barriers a person actually meets. Three WCAG 2.2 level AA criteria in particular are <strong>not</strong> covered by the checks above and need a human evaluator:</p><ul><li><strong>2.4.7 Focus Visible</strong> - whether the keyboard focus indicator is genuinely visible on every control, over every background it can appear against.</li><li><strong>2.5.8 Target Size (Minimum)</strong> - whether links and controls, in particular those packed closely together such as pager links, are large enough to hit reliably.</li><li><strong>1.4.10 Reflow</strong> - whether a wide financial table stays usable on a narrow screen without scrolling in two directions at once.</li></ul><p>The template was built with all three in mind: focus indicators are drawn rather than removed, targets are sized deliberately, and wide tables scroll inside a region the keyboard can reach. <strong>A design decision is not a measurement</strong>, so all three are recorded here as unverified rather than counted as passed.</p><h2>Known non-accessible content</h2><ul><li><strong>Published documents and datasets.</strong> Budgets, minutes, plans and spreadsheets are produced outside this site, and their accessibility is a property of those files rather than of the pages that list them. PDF files in particular are frequently untagged. Where a document is not accessible, ask for its content in another form using the contact route below.</li><li><strong>Anything added after installation.</strong> Pages, embedded maps, video players and third-party widgets added by the body are outside every check listed above.</li></ul><h2>Feedback and how to report a barrier</h2><p><strong>To be completed by the body operating this site.</strong> Give a route that reaches a person, and state how quickly it will be answered. A postal address, an email address and a telephone number are the usual minimum, and at least one of them must not require the use of this website.</p><p>If you cannot use part of this site, or you need something published here in a different format, say which page you were on and what you were trying to do. That is enough to start.</p><h2>Enforcement procedure</h2><p><strong>To be completed by the body operating this site.</strong> Name the body that supervises accessibility complaints in your jurisdiction, and say how to escalate a complaint that has not been answered. The supervising body, the time limits and the required wording all differ between jurisdictions, so none is shipped here: a wrong name is worse than no name.</p><h2>Preparation of this statement</h2><p><strong>To be completed by the body operating this site:</strong> the date on which this statement was last reviewed against this site, and the method used.</p><p>The text above was prepared on 5 September 2026 by self-assessment of the site template, using the automated checks named in it. It is a starting point and it is not a substitute for evaluating the site the body actually publishes.</p>'
      format: content_format
