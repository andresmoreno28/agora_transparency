      value: 'How accessible this site is, what has been tested and what has not, and how to report a barrier.'
  field_content:
    -
      value: '<p><strong>This statement is a starting point, not a finished document.</strong> Before publishing it, the body operating this site must complete the sections marked <em>To be completed</em>: its own name, the date of its own review, and a contact route a member of the public can actually use. Everything else on this page describes the site template as it is shipped, and every claim below names the check that produced it.</p><h2>What this statement covers</h2><p>It covers the pages this site serves to the public: the front page, the registers of contracts, grants, agreements, documents, datasets and people, the record page of each entry in those registers, and the document library.</p><p>It does not cover the administrative interface, nor any page, file or embedded service added to the site after installation.</p><p>The administrative interface is <strong>not</strong> Drupal core. What an editor of this site works in is the Gin administration theme, together with the contributed and core modules that the Drupal CMS administration recipe installs beside it - among them the Coffee quick-search box and the Navigation sidebar - and the Config Guardian dashboard, which this site template chose, installed and configured itself. Most of that interface comes from Drupal CMS and from projects this site template does not maintain. The Config Guardian dashboard is different: it is on this site because this site template put it there, and so it is checked.</p><p><strong>The Config Guardian dashboard is scanned by axe-core on every change</strong>, signed in as a user holding only the Governance auditor role, which this site template ships so that someone other than the administrator can read that dashboard. <strong>The scan finds colour contrast failures in markup that Config Guardian itself provides</strong>: text whose colour and background both come from that module, and whose contrast is below the minimum that level AA sets. This site template does not write that markup and does not maintain it. The same scan also finds parts of the Gin and Coffee interface on that page placed outside every landmark region. <strong>The dashboard therefore does not meet level AA, and a passing check does not mean that it does:</strong> the check fails when a new finding appears, when a known one disappears, or when a finding cannot be shown to sit in markup that another project provides. <strong>No accessibility check covers any other page of the administrative interface</strong>, the other pages of Config Guardian included.</p><h2>Conformance status</h2><p>The target is the <strong>Web Content Accessibility Guidelines (WCAG) 2.2, level AA</strong>.</p><p><strong>No claim of full conformance is made here.</strong> This site has not been audited end to end by an independent evaluator, and no automated test suite can establish conformance on its own. What has been verified is listed below, and what has not been verified is listed beside it. A body that needs a conformance claim needs an evaluation of its own site, carrying its own content.</p><h2>What is verified automatically, on every change</h2><p>This site template runs its own automated checks in continuous integration; they are described in full in <a href="https://git.drupalcode.org/project/agora_transparency/-/blob/1.x/ACCESSIBILITY.md">ACCESSIBILITY.md</a>, in the public repository for this project.</p><p><strong>To be completed by the organisation running this site:</strong> what has been separately verified about this installation, beyond those checks.</p><h2>What automated testing does not check</h2><p>Automated tools find only a part of the barriers a person actually meets. Some WCAG 2.2 criteria in particular are <strong>not</strong> covered by the checks above, or are covered only in part, and need a human evaluator:</p><ul><li><strong>2.4.7 Focus Visible</strong> - whether the keyboard focus indicator is genuinely visible on every control, over every background it can appear against.</li><li><strong>1.4.10 Reflow</strong> - whether a wide financial table stays usable on a narrow screen without scrolling in two directions at once.</li><li><strong>2.4.1 Bypass Blocks, in use</strong> - the target the skip link points at is checked on every key route, but whether the link is reached first by a keyboard, and whether following it moves focus there, are not.</li><li><strong>2.5.8 Target Size (Minimum), in part</strong> - the targets the automated check reports for review rather than deciding, and any window size other than the size it measures at.</li></ul><p>The template was built with these in mind: focus indicators are drawn rather than removed, targets are sized deliberately, and wide tables scroll inside a region the keyboard can reach. <strong>A design decision is not a measurement</strong>, so what the checks above do not reach is recorded here as unverified rather than counted as passed.</p><h2>Known non-accessible content</h2><ul><li><strong>Published documents and datasets.</strong> Budgets, minutes, plans and spreadsheets are produced outside this site, and their accessibility is a property of those files rather than of the pages that list them. PDF files in particular are frequently untagged. Where a document is not accessible, ask for its content in another form using the contact route below.</li><li><strong>Most of the pages on this site.</strong> The pages listed above are scanned and this site serves many more. The listing routes not named there are not covered; one record page is scanned out of every record published; and the prose pages, including this statement, the legal notice and the privacy notice, are not among them. The pages that are not scanned are built from the same templates the nine exercise, which is a reason to expect them to behave the same way and not evidence that they do.</li><li><strong>Anything added after installation.</strong> Pages, embedded maps, video players and third-party widgets added by the body are outside every check listed above.</li></ul><h2>Feedback and how to report a barrier</h2><p><strong>To be completed by the body operating this site.</strong> Give a route that reaches a person, and state how quickly it will be answered. A postal address, an email address and a telephone number are the usual minimum, and at least one of them must not require the use of this website.</p><p>If you cannot use part of this site, or you need something published here in a different format, say which page you were on and what you were trying to do. That is enough to start.</p><h2>Enforcement procedure</h2><p><strong>To be completed by the body operating this site.</strong> Name the body that supervises accessibility complaints in your jurisdiction, and say how to escalate a complaint that has not been answered. The supervising body, the time limits and the required wording all differ between jurisdictions, so none is shipped here: a wrong name is worse than no name.</p><h2>Preparation of this statement</h2><p><strong>To be completed by the body operating this site:</strong> the date on which this statement was last reviewed against this site, and the method used.</p><p>The text above was prepared on 5 September 2026 and last revised on 24 September 2026, by self-assessment of the site template, using the automated checks named in it. It is a starting point and it is not a substitute for evaluating the site the body actually publishes.</p>'
