# Contains a GitHub Actions workflow to run PHPUnit tests for this site template.
# You can delete this file if you're not using hosting the repository on GitHub.
#
# See https://docs.github.com/en/actions for documentation about GitHub Actions.
#
on:
  - push
  - pull_request
jobs:
  phpunit:
    name: Run PHPUnit tests
    runs-on: ubuntu-latest
    env:
      # Test classes this rig cannot run, declared here ONCE so the command line below
      # and the reconciliation in the last step read the same list. Space-separated.
      EXCLUDED_TEST_CLASSES: AccessibilityTest
    steps:
      # Use DDEV to set up the environment, because it gives us everything we
      # need and it just works.
      - name: Set up DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      # Test with a plain Drupal project, like the default GitLab CI setup does.
      - name: Initialize DDEV and create a Drupal project
        # @see https://docs.ddev.com/en/stable/users/quickstart/#drupal
        run: |
          ddev config --project-type=drupal11 --docroot=web

          # For performance, don't audit dependencies.
          ddev config --web-environment-add="COMPOSER_NO_AUDIT=1"

          # Fully copy the site template into the project, rather than symlinking it.
          ddev config --web-environment-add="COMPOSER_MIRROR_PATH_REPOS=1"

          # Set environment variables needed by PHPUnit.
          # @see https://docs.ddev.com/en/stable/users/extend/custom-commands/#environment-variables-provided
          ddev config --web-environment-add='SIMPLETEST_BASE_URL=$DDEV_PRIMARY_URL'
          ddev config --web-environment-add='SIMPLETEST_DB=$DDEV_DATABASE_FAMILY://db:db@db/db'

          ddev start
          ddev composer create-project --no-install drupal/recommended-project

          # Require development dependencies like PHPUnit, but don't install them yet.
          ddev composer require --no-update --dev drupal/core-dev

      # Check out this repository.
      - uses: actions/checkout@v5
        with:
          path: source

      # We'll need to know the package name in the next step, so extract it into an
      # environment variable now.
      - name: Extract package name
        run: echo "PACKAGE_NAME=$(jq -r .name ./source/composer.json)" >> $GITHUB_ENV

      - name: Install the site template
        run: |
          ddev composer repository add source path source
          ddev composer config allow-plugins.drupal/site_template_helper true
          ddev composer require --update-with-all-dependencies "$PACKAGE_NAME:@dev"

      # Copy this repository's tests into the installed recipe so PHPUnit can find them.
      #
      # `/tests` is deliberately excluded from the packaged release (.gitattributes,
      # D-020 rider d) - end users of this site template must not receive tests. But
      # COMPOSER_MIRROR_PATH_REPOS=1 (set above) makes Composer mirror this package into
      # ./recipes/ through the same export-ignore-aware machinery release packaging uses, so
      # the installed copy never gets a tests/ directory either. Left unfixed, PHPUnit finds
      # nothing under ./recipes/<name>, prints "No tests executed!" and exits 0 - a build that
      # looks green while testing nothing (T-212, I-032, I-033). This mirrors what the
      # canonical drupalcode pipeline already does for the same reason: gitlab_templates'
      # `.recipe-replace-symlinks` (include.drupalci.main.yml:1605-1611) force-copies tests/
      # from the clone, where export-ignore does not apply.
      #
      # TRAP: this must stay the LAST step before "Run tests". Any composer command placed
      # after this one re-mirrors the path repository and silently deletes
      # ./recipes/<name>/tests again - the exact defect this step exists to fix, reintroduced
      # by an innocent-looking edit.
      - name: Copy the recipe's tests into the installed package
        run: |
          RECIPE_DIR="./recipes/$(basename "$PACKAGE_NAME")"
          rm -rf "$RECIPE_DIR/tests"
          cp -R ./source/tests "$RECIPE_DIR/"
          test -f "$RECIPE_DIR/tests/src/Kernel/RequirementsTest.php" \
            || { echo "FATAL: tests did not reach $RECIPE_DIR"; exit 1; }
          find "$RECIPE_DIR/tests" -name '*Test.php' | wc -l

      # A run that executes zero tests must FAIL, not pass silently: nine of ten prior runs
      # of this workflow did exactly that and nothing caught it (T-212). --fail-on-empty-test-suite
      # is PHPUnit's own guard for this (PHPUnit 11.5, ShellExitCodeCalculator: "if
      # ($failOnEmptyTestSuite && !$result->hasTests()) { $returnCode = FAILURE_EXIT; }"), so it
      # holds even if this workflow's runner changes later. A suite that executed 0 tests is a
      # FAILED gate, not a passed one (I-007, I-032). --testdox names each test in the log
      # instead of only counting them (T-406).
      #
      # --log-junit writes the SAME run to XML, and the next step reads it. The printer and
      # the logger are independent code paths, and the difference is not academic: a test
      # that fails inside setUp() never emits PHPUnit's Test\Prepared event, so the TestDox
      # collector never registers it. Run 35451608869 printed a --testdox list of 19 tests
      # with no failure marker in it, above a summary reading `Tests: 19 ... Failures: 1`,
      # while the JUnit log of the very next run recorded 20 testcases and named the failing
      # one. The test was missing from the list it failed in, which reads exactly like a test
      # that never ran.
      #
      # WHY ONE TEST CLASS IS EXCLUDED, BY NAME, AND WHY THAT IS NOT A WEAKENED GATE.
      #
      # AccessibilityTest extends WebDriverTestBase: it drives a real browser over Selenium
      # and scans each installed page with axe. This rig provides neither half. It builds a
      # plain `ddev config --project-type=drupal11` project with no selenium add-on, so
      # nothing listens on port 4444; and it never runs `yarn install` in core, so
      # `web/core/node_modules/axe-core/axe.min.js` - the file that test's first assertion
      # guards - is absent too. Measured rather than assumed: run 35452977342 failed with
      #
      #   Behat\Mink\Exception\DriverException: Could not open connection: Failed to
      #   connect to localhost port 4444 after 0 ms: Could not connect to server
      #
      # and every frame of that stack is inside BrowserTestBase::setUp() and
      # WebDriverTestBase::initMink(); not one is inside AccessibilityTest.php. The test is
      # right and this environment is wrong. The canonical drupalcode pipeline runs it
      # properly - real Chrome behind a Selenium service, node_modules delivered as an
      # artifact by the `composer` job - and is green on it. D-020 makes drupalcode the gate
      # and this mirror a second opinion, so the honest answer is to say which question this
      # mirror does not answer, not to make it answer that question badly.
      #
      # NEVER SILENTLY, and that is the whole difference between this and the three shapes
      # of cheating it resembles. The exclusion is one variable, spelled out in the command
      # line, and the NEXT STEP RECONCILES IT: it lists every *Test.php the package ships
      # and every class the JUnit log records, and fails unless the difference is exactly
      # EXCLUDED_TEST_CLASSES. Add a test class that quietly does not run, or delete the
      # excluded one without updating the list, and this job goes red naming the class.
      #
      # RUN THROUGH A FILE, NOT THROUGH ARGUMENTS, and that is a measured requirement rather
      # than a style. `ddev exec` re-assembles everything after it into ONE shell string and
      # runs that inside the container, so host-side quoting does not survive the trip. Run
      # 35453860620 passed --exclude-filter "/^(AccessibilityTest)::/" and the container
      # answered `bash: -c: line 1: syntax error near unexpected token '('`, having seen the
      # parentheses bare. Writing the invocation to a file and running the file removes
      # argument quoting from the problem entirely, and it keeps the filter ANCHORED - the
      # alternative, a bare substring filter carrying no regex metacharacters, would survive
      # `ddev exec` but would silently also match any future class whose name contains this
      # one.
      - name: Run tests
        run: |
          EXCLUDE="$(echo "$EXCLUDED_TEST_CLASSES" | tr -s ' ' '|')"
          cat > run-phpunit.sh <<SCRIPT
          set -eu
          cd /var/www/html
          phpunit --configuration=./web/core --testdox --fail-on-empty-test-suite --exclude-filter '/^($EXCLUDE)::/' --log-junit /var/www/html/phpunit-junit.xml ./recipes/$(basename $PACKAGE_NAME)
          SCRIPT
          echo "--- excluding by name: $EXCLUDED_TEST_CLASSES ---"
          cat run-phpunit.sh
          ddev exec bash /var/www/html/run-phpunit.sh

      # WHY THIS STEP EXISTS, and it is a legibility defect rather than a test defect.
      #
      # This workflow failed on nine consecutive runs between 2026-08-27 and 2026-09-19,
      # emailing the maintainer each time, and the log never said why - see the run quoted
      # above. A check that is red for three weeks is not informative, it is noise that
      # teaches its reader to ignore it. D-020 holds that this mirror may fail without
      # blocking but may never lie, and a result nobody can read is not a result (I-034).
      #
      # So this prints every failed or errored test by name, file and message, at the END of
      # the log where a reader looks; emits a ::error:: annotation so the notification email
      # names the test rather than only the job; and writes the same into the step summary.
      # It then reconciles the classes that ran against the classes the package ships.
      #
      # IT WEAKENS NOTHING. `Run tests` above still owns the job's verdict on the tests. This
      # step fails ONLY for instrumentation and accounting defects - no XML, no testcases, or
      # a set of absent classes that is not the declared one - because a report about nothing
      # must never be able to look like a clean report (I-007, I-028).
      - name: Name every failed test, and account for every class
        if: always()
        run: |
          ddev exec cat /var/www/html/phpunit-junit.xml > junit.xml 2>/dev/null || true
          if [ ! -s junit.xml ]; then
            echo "::error::PHPUnit wrote no JUnit log, so the failure detail this step exists to print does not exist. Failing rather than reporting nothing."
            exit 1
          fi
          RECIPE_DIR="./recipes/$(basename "$PACKAGE_NAME")" python3 - junit.xml <<'PYEOF'
          import glob
          import os
          import sys
          import xml.etree.ElementTree as ElementTree

          log = ElementTree.parse(sys.argv[1])
          cases = list(log.iter('testcase'))
          bad = [(case, child) for case in cases for child in case
                 if child.tag in ('failure', 'error')]

          rule = '=' * 74
          print('')
          print(rule)
          print('JUnit log: %d testcase(s) recorded; %d carry a failure or an error.'
                % (len(cases), len(bad)))
          # One line per CLASS. The count is the first thing to disagree with the canonical
          # pipeline, and the class list is what says WHICH test is missing here.
          for suite in log.iter('testsuite'):
              if suite.find('testsuite') is None and suite.get('tests'):
                  print('  %-34s tests=%s failures=%s errors=%s skipped=%s'
                        % (suite.get('name'), suite.get('tests'), suite.get('failures'),
                           suite.get('errors'), suite.get('skipped')))
          print(rule)

          problems = []

          # ------------------------------------------------ account for every test class
          # An exclusion that is only a comment is an exclusion that grows. This compares
          # what the package ships against what the log records and insists the difference
          # is exactly what the job declares.
          recipe = os.environ.get('RECIPE_DIR', '')
          pattern = os.path.join(recipe, 'tests', '**', '*Test.php')
          shipped = sorted({os.path.basename(path)[:-4]
                            for path in glob.glob(pattern, recursive=True)})
          declared = sorted(set(os.environ.get('EXCLUDED_TEST_CLASSES', '').split()))
          ran = sorted({case.get('class') for case in cases if case.get('class')})
          absent = sorted(set(shipped) - set(ran))

          print('')
          print('class accounting')
          print('  shipped by the package : %d  %s' % (len(shipped), ' '.join(shipped)))
          print('  recorded in the log    : %d  %s' % (len(ran), ' '.join(ran)))
          print('  absent from the log    : %d  %s' % (len(absent), ' '.join(absent)))
          print('  declared as excluded   : %d  %s' % (len(declared), ' '.join(declared)))

          if not shipped:
              problems.append('No *Test.php found under %s, so this accounting compared '
                              'nothing against nothing.' % pattern)
          if not cases:
              problems.append('The JUnit log records no testcase at all.')
          if absent != declared:
              problems.append('Classes absent from the run are %s but this job declares '
                              '%s. Every class this rig does not run must be named in '
                              'EXCLUDED_TEST_CLASSES, with the reason, in the step above.'
                              % (absent or ['none'], declared or ['none']))

          # ------------------------------------------------ name what actually failed
          found = []
          for case, child in bad:
              name = '%s::%s' % (case.get('class') or '?', case.get('name') or '?')
              where = '%s:%s' % (case.get('file') or '?', case.get('line') or '?')
              text = (child.text or child.get('message') or '').strip()
              print('')
              print('%s  <%s>' % (name, child.tag))
              print('  declared at %s' % where)
              for line in (text or '(no message recorded)').splitlines():
                  print('    ' + line)
              found.append((name, where, text))

          for name, where, text in found:
              # PHPUnit's failure text opens with the test id, so line 1 is the name
              # again; the sentence a reader needs is the first line after it.
              speaking = [line.strip() for line in text.splitlines()
                          if line.strip() and line.strip() != name]
              head = speaking[0] if speaking else '(no message recorded)'
              print('::error::%s (%s) - %s' % (name, where, head[:500]))

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as handle:
                  handle.write('### PHPUnit: %d testcase(s) recorded, %d failed\n\n'
                               % (len(cases), len(bad)))
                  handle.write('Excluded by name: %s\n\n'
                               % (', '.join(declared) or 'nothing'))
                  for name, where, text in found:
                      handle.write('**%s**\n\n`%s`\n\n```\n%s\n```\n\n'
                                   % (name, where, text or '(no message recorded)'))

          for problem in problems:
              print('::error::%s' % problem)
          sys.exit(1 if problems else 0)
          PYEOF
