# Contains a GitHub Actions workflow to run PHPUnit tests for this site template.
# You can delete this file if you're not using hosting the repository on GitHub.
#
# See https://docs.github.com/en/actions for documentation about GitHub Actions.
#
on:
  - push
  - pull_request
jobs:
  phpunit:
    name: Run PHPUnit tests
    runs-on: ubuntu-latest
    steps:
      # Use DDEV to set up the environment, because it gives us everything we
      # need and it just works.
      - name: Set up DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      # Test with a plain Drupal project, like the default GitLab CI setup does.
      - name: Initialize DDEV and create a Drupal project
        # @see https://docs.ddev.com/en/stable/users/quickstart/#drupal
        run: |
          ddev config --project-type=drupal11 --docroot=web

          # For performance, don't audit dependencies.
          ddev config --web-environment-add="COMPOSER_NO_AUDIT=1"

          # Fully copy the site template into the project, rather than symlinking it.
          ddev config --web-environment-add="COMPOSER_MIRROR_PATH_REPOS=1"

          # Set environment variables needed by PHPUnit.
          # @see https://docs.ddev.com/en/stable/users/extend/custom-commands/#environment-variables-provided
          ddev config --web-environment-add='SIMPLETEST_BASE_URL=$DDEV_PRIMARY_URL'
          ddev config --web-environment-add='SIMPLETEST_DB=$DDEV_DATABASE_FAMILY://db:db@db/db'

          ddev start
          ddev composer create-project --no-install drupal/recommended-project

          # Require development dependencies like PHPUnit, but don't install them yet.
          ddev composer require --no-update --dev drupal/core-dev

      # Check out this repository.
      - uses: actions/checkout@v5
        with:
          path: source

      # We'll need to know the package name in the next step, so extract it into an
      # environment variable now.
      - name: Extract package name
        run: echo "PACKAGE_NAME=$(jq -r .name ./source/composer.json)" >> $GITHUB_ENV

      - name: Install the site template
        run: |
          ddev composer repository add source path source
          ddev composer config allow-plugins.drupal/site_template_helper true
          ddev composer require --update-with-all-dependencies "$PACKAGE_NAME:@dev"

      # Copy this repository's tests into the installed recipe so PHPUnit can find them.
      #
      # `/tests` is deliberately excluded from the packaged release (.gitattributes,
      # D-020 rider d) - end users of this site template must not receive tests. But
      # COMPOSER_MIRROR_PATH_REPOS=1 (set above) makes Composer mirror this package into
      # ./recipes/ through the same export-ignore-aware machinery release packaging uses, so
      # the installed copy never gets a tests/ directory either. Left unfixed, PHPUnit finds
      # nothing under ./recipes/<name>, prints "No tests executed!" and exits 0 - a build that
      # looks green while testing nothing (T-212, I-032, I-033). This mirrors what the
      # canonical drupalcode pipeline already does for the same reason: gitlab_templates'
      # `.recipe-replace-symlinks` (include.drupalci.main.yml:1605-1611) force-copies tests/
      # from the clone, where export-ignore does not apply.
      #
      # TRAP: this must stay the LAST step before "Run tests". Any composer command placed
      # after this one re-mirrors the path repository and silently deletes
      # ./recipes/<name>/tests again - the exact defect this step exists to fix, reintroduced
      # by an innocent-looking edit.
      - name: Copy the recipe's tests into the installed package
        run: |
          RECIPE_DIR="./recipes/$(basename "$PACKAGE_NAME")"
          rm -rf "$RECIPE_DIR/tests"
          cp -R ./source/tests "$RECIPE_DIR/"
          test -f "$RECIPE_DIR/tests/src/Kernel/RequirementsTest.php" \
            || { echo "FATAL: tests did not reach $RECIPE_DIR"; exit 1; }
          find "$RECIPE_DIR/tests" -name '*Test.php' | wc -l

      # A run that executes zero tests must FAIL, not pass silently: nine of ten prior runs
      # of this workflow did exactly that and nothing caught it (T-212). --fail-on-empty-test-suite
      # is PHPUnit's own guard for this (PHPUnit 11.5, ShellExitCodeCalculator: "if
      # ($failOnEmptyTestSuite && !$result->hasTests()) { $returnCode = FAILURE_EXIT; }"), so it
      # holds even if this workflow's runner changes later. A suite that executed 0 tests is a
      # FAILED gate, not a passed one (I-007, I-032). --testdox names each test in the log
      # instead of only counting them (T-406).
      #
      # --log-junit writes the SAME run to XML, and the next step reads it. The printer and
      # the logger are independent code paths: a test that fails inside setUp() never reaches
      # the TestDox collector and is therefore absent from the --testdox list it failed in,
      # while the XML still carries its <testcase> and the <failure> under it. That gap cost
      # this workflow three weeks of unreadable reds - see the next step.
      - name: Run tests
        run: ddev exec phpunit --configuration=./web/core --testdox --fail-on-empty-test-suite --log-junit /var/www/html/phpunit-junit.xml ./recipes/$(basename $PACKAGE_NAME)

      # WHY THIS STEP EXISTS, and it is a legibility defect rather than a test defect.
      #
      # This workflow failed on nine consecutive runs between 2026-08-27 and 2026-09-19,
      # emailing the maintainer each time, and the log never said why. The final run printed
      # `Tests: 19, Assertions: 2362, Failures: 1, Deprecations: 138` over 138 deprecation
      # reports and NOT ONE WORD about the failure: no `x` marker in the --testdox list, no
      # "There was 1 failure:" section, no assertion message anywhere in 408 KB of log. The
      # failing test was missing from the very list it failed in, which reads exactly like a
      # test that never ran.
      #
      # A check that is red for three weeks is not informative, it is noise that teaches its
      # reader to ignore it (D-020: the mirror may fail without blocking, but it may never
      # lie). So the first fix is not to the test, it is to the reporting: a result nobody
      # can read is not a result (I-034).
      #
      # IT DOES NOT WEAKEN THE GATE, and that is the point rather than a caveat. It changes
      # nothing about which tests run; `Run tests` above still owns the job's exit code. What
      # it adds is a sentence at the END of the log where a reader looks, a ::error::
      # annotation so the notification email names the test instead of only naming the job,
      # and a step summary. A missing or empty XML FAILS here, because a report about nothing
      # must never be able to look like a clean report (I-007, I-028).
      - name: Name every failed test, with its message
        if: always()
        run: |
          ddev exec cat /var/www/html/phpunit-junit.xml > junit.xml 2>/dev/null || true
          if [ ! -s junit.xml ]; then
            echo "::error::PHPUnit wrote no JUnit log, so the failure detail this step exists to print does not exist. Failing rather than reporting nothing."
            exit 1
          fi
          python3 - junit.xml <<'PYEOF'
          import os
          import sys
          import xml.etree.ElementTree as ElementTree

          log = ElementTree.parse(sys.argv[1])
          cases = list(log.iter('testcase'))
          bad = [(case, child) for case in cases for child in case
                 if child.tag in ('failure', 'error')]

          rule = '=' * 74
          print('')
          print(rule)
          print('JUnit log: %d testcase(s) recorded; %d carry a failure or an error.'
                % (len(cases), len(bad)))
          # One line per CLASS, because the count is the first thing to disagree with the
          # canonical pipeline and the class list is what says which test is missing here.
          for suite in log.iter('testsuite'):
              if suite.find('testsuite') is None and suite.get('tests'):
                  print('  %-34s tests=%s failures=%s errors=%s skipped=%s'
                        % (suite.get('name'), suite.get('tests'), suite.get('failures'),
                           suite.get('errors'), suite.get('skipped')))
          print(rule)

          if not cases:
              print('The JUnit log records no testcase at all.')
              sys.exit(1)

          found = []
          for case, child in bad:
              name = '%s::%s' % (case.get('class') or '?', case.get('name') or '?')
              where = '%s:%s' % (case.get('file') or '?', case.get('line') or '?')
              text = (child.text or child.get('message') or '').strip()
              print('')
              print('%s  <%s>' % (name, child.tag))
              print('  declared at %s' % where)
              for line in (text or '(no message recorded)').splitlines():
                  print('    ' + line)
              found.append((name, where, text))

          for name, where, text in found:
              # PHPUnit's failure text opens with the test id, so line 1 is the name
              # again; the sentence a reader needs is the first line after it.
              speaking = [line.strip() for line in text.splitlines()
                          if line.strip() and line.strip() != name]
              head = speaking[0] if speaking else '(no message recorded)'
              print('::error::%s (%s) - %s' % (name, where, head[:500]))

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as handle:
                  handle.write('### PHPUnit: %d testcase(s) recorded, %d failed\n\n'
                               % (len(cases), len(bad)))
                  for name, where, text in found:
                      handle.write('**%s**\n\n`%s`\n\n```\n%s\n```\n\n'
                                   % (name, where, text or '(no message recorded)'))
          PYEOF
