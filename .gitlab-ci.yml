################
# GitLabCI template for Drupal projects.
#
# This template is designed to give any Contrib maintainer everything they need to test, without requiring modification.
# It is also designed to keep up to date with Core Development automatically through the use of include files that can be centrally maintained.
# As long as you include the project, ref and three files below, any future updates added by the Drupal Association will be used in your
# pipelines automatically. However, you can modify this template if you have additional needs for your project.
# The full documentation is on https://project.pages.drupalcode.org/gitlab_templates/
################

# For information on alternative values for 'ref' see https://project.pages.drupalcode.org/gitlab_templates/info/templates-version/
# To test a Drupal 7 project, change the first include filename from .main.yml to .main-d7.yml
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'
#
################
# Pipeline configuration variables are defined with default values and descriptions in the file
# https://git.drupalcode.org/project/gitlab_templates/-/blob/main/includes/include.drupalci.variables.yml
# Uncomment the lines below if you want to override any of the variables. The following is just an example.
################
# variables:
#   SKIP_ESLINT: '1'
#   OPT_IN_TEST_NEXT_MAJOR: '1'
#   _CURL_TEMPLATES_REF: 'main'

# T-214(c): a green PHPUnit job must mean tests actually ran. _PHPUNIT_EXTRA
# is handed to the phpunit binary and armed with --fail-on-empty-test-suite
# so an empty suite fails the pipeline instead of passing silently (see
# tests/bin/no-blind-phpunit, and I-007 - the false-green pattern this
# closes).
#
# AMENDED 2026-09-13 (T-1701). The sentence that stood here said
# _PHPUNIT_CONCURRENT was "deliberately left unset/default ('0')", and then
# described, correctly and in full, the exact failure that came true. The
# reasoning was right; the word "default" was the defect. Upstream flipped
# that default to concurrent between 2026-09-08 and 2026-09-12 and NOT ONE
# CHARACTER of this repository changed. At the concurrent setting drupalci
# routes the flags to run-tests.sh instead of the phpunit binary and strips
# every phpunit-only option out of them on the way, so
# --fail-on-empty-test-suite reached nothing at all.
#
# MEASURED, from the API with the maintainer's token (/trace answers 401
# anonymously) rather than from the pipeline badge:
#   952632 (2026-09-08) - the phpunit binary, the flag on its command line,
#                         "OK (20 tests, 2549 assertions)".
#   958565 and every pipeline since - run-tests.sh, no "OK (...)" line, no
#                         assertion total, 20 "Pass" lines, and upstream's own
#                         warning in the trace that _PHPUNIT_EXTRA "is
#                         intended for the 'phpunit' binary only". The trace
#                         shows _RUNTESTS_EXTRA='' after the compatibility
#                         copy had removed the phpunit-only options.
#
# So the value is PINNED below instead of inherited. Upstream documents it at
# include.drupalci.variables.yml:111-113 ("set to 0 to use the plain phpunit
# binary"), and _PHPUNIT_EXTRA's own description at :103-105 now states the
# coupling in as many words: "used when _PHPUNIT_CONCURRENT is set to 0". The
# citation in the superseded sentence (:107-109) pointed at that pair before
# the file moved underneath it, which is its own small instance of the same
# lesson.
#
# THIS REDEFINES NO UPSTREAM JOB, and that reading is confirmed against this
# file's own standing rule rather than asserted: setting a documented pipeline
# variable is what the header of this file invites in its own example block
# (lines 22-29, "Uncomment the lines below if you want to override any of the
# variables"), and it is what _ALL_VALIDATE_ALLOW_FAILURE, _CSPELL_EXTRA,
# _PHPCS_EXTRA, OPT_IN_TEST_DRUPAL_CMS and _AUTORUN_DRUPAL_CMS below already
# do. The `include:` block above stays byte-identical to upstream and no
# upstream job key is redefined, copied or overridden.
#
# COST, MEASURED RATHER THAN ASSUMED, because concurrency was presumably
# turned on upstream for a reason. It buys this package nothing: over the four
# most recent serial runs `phpunit` took 480-696 s, and over the four
# concurrent ones 569-661 s - ranges that overlap almost entirely, because 20
# tests dominated by functional-test setup do not fill eight threads. Upstream
# declares no `timeout` in any of the three included files, so the GitLab
# default of one hour applies and the job sits at roughly a fifth of it. There
# is no timeout risk to weigh; if that changes, the number to watch is the one
# above and not this sentence.
#
# tests/bin/no-blind-phpunit asserts the pin. It has to be asserted somewhere,
# because a guard that reads only our files cannot see a default that lives in
# somebody else's (I-116). It was asserted in tests/bin/no-ci-allow-dev between
# 2026-09-13 and 2026-09-19, which was never its subject; T-1903 moved it to
# the invariant whose subject the phpunit gate actually is.
variables:
  _PHPUNIT_EXTRA: '--fail-on-empty-test-suite'
  _PHPUNIT_CONCURRENT: '0'

# D-023(1): makes the validate stage blocking. Documented at
# include.drupalci.variables.yml:127-129 ("set to 0 for not allowing any
# failure"). This is a variable read by the upstream ladder, not a job
# override - the include: block above stays byte-identical to upstream.
  _ALL_VALIDATE_ALLOW_FAILURE: '0'


# T-222: --dot adds hidden paths to the scan. Without it cspell opened 37 of
# 64 tracked files and skipped every dot-path - .claude/ (14 files), .github/,
# .tugboat/ and the root dotfiles. D-024(4) names .claude/ as something that
# must NOT be excluded, and a Spanish comment in .claude/settings.json had
# survived there unseen, so the exclusion was arriving by upstream default
# rather than by our choice - which is worse than choosing it.
# D-024(3): the repository's prose is British English (behaviour, licence,
# organisation, artefacts, normalise). dict-en-gb-mit is bundled in the
# runner's cspell; dict-es-es is not (D-024(1)). Declaring the actual
# language of the text is not silencing a check.
  _CSPELL_EXTRA: '--locale en,en-GB --dot'


# T-222: make the blocking checks state their DENOMINATOR. Pipeline 933342 ran
# seven blocking jobs green, and four of them reported a verdict without ever
# saying how many files they opened: cspell printed "Files checked: 36" against
# a tree of 63 tracked files, phpcs printed nothing at all between its
# invocation and its exit code, and phpstan/eslint printed "no errors" over an
# unstated denominator. A blocking check over an unknown denominator is not a
# stronger gate than a permissive one, it is a more confident one (I-007).
# The two variables below are upstream's own, not job overrides.
#
# include.drupalci.variables.yml:183 - default '0'. "Set to 1 to show the
# progress of the `CSpell` job, displaying the name of each file as it is
# checked." Consumed at include.drupalci.main.yml:1312, where '1' drops
# cspell's --no-progress flag. This turns the unexplained 36-vs-63 gap into a
# named list; the reconciliation itself needs that log and is NOT done here.
  _CSPELL_SHOW_PROGRESS: '1'

# include.drupalci.variables.yml:143 - default ''. "Additional options that are
# appended to the `phpcs` job call." Appended at include.drupalci.main.yml:1027.
# `-p` makes phpcs print its progress line, "N / N (100%)", so a green phpcs
# stops being a bare exit code and becomes a count.
  _PHPCS_EXTRA: '-p'


################
# T-511 - Amendment to D-020 (2026-08-24): the clean-install smoke moves onto
# the canonical gate and becomes BLOCKING there. Until today the only place this
# package was ever assembled against a real Drupal was the GitHub mirror, which
# D-020 classifies as an informative surface - one a Drupal.org reviewer cannot
# re-run. GitHub keeps running as a second opinion; what ends is its monopoly.
#
# Both variables below are upstream's own, read AT SOURCE on 2026-08-24 over
# https://git.drupalcode.org/project/gitlab_templates/-/raw/main/includes/include.drupalci.main.yml
# and its sibling variables file - not inferred from their names. No upstream
# job is redefined, copied or overridden; the `include:` block above stays
# byte-identical to upstream.
#
# include.drupalci.variables.yml:344-346 - default '0'. "Set to 1 to opt in
# testing against the current stable Drupal CMS version." The first rule the
# `Drupal CMS` job evaluates is `.opt-in-drupal-cms`
# (include.drupalci.main.yml:440-442), which is `when: never` while this is not
# exactly the string '1'. Without this line the job is not in the pipeline at
# all - and a job that never materialises is I-050, not a pass.
################
  OPT_IN_TEST_DRUPAL_CMS: '1'

################
# include.drupalci.variables.yml:415-423 - default 'none', with the enumerated
# options none / push / push-and-mr / push-and-schedule / all. 'all' matches
# REGEX_ALL, which is `/^all$/i`
# (include.drupalci.hidden-variables.yml:320), so the job's SECOND rule fires.
#
# CITATION CHECKED, AND IT HOLDS. The task row cites
# include.drupalci.main.yml:487-496; on `main` today that span holds exactly the
# two rules this variable chooses between:
#   487-492  `.autorun-drupal-cms-rule` - four `if` alternatives ending in
#            `when: always`, declaring no failure tolerance of its own, so the
#            job starts automatically and a red one fails the pipeline.
#   494-496  `.make-job-manual` - the fallback that applies otherwise: the job
#            is manual and its failure is tolerated. That is the state this
#            line moves the smoke out of.
#
# NOTE: `_ALL_VALIDATE_ALLOW_FAILURE: '0'` above does NOT reach this job. It
# governs the validate stage, and `Drupal CMS` is declared in the `build` stage
# (include.drupalci.main.yml:858-864). Should the job nevertheless materialise
# permissive, D-023(5) requires a dated, owned exception written into this file,
# and that exception list is empty as of 2026-08-24. Do not paper over it.
#
# What the job actually does, so a later reader need not guess: it creates a
# fresh `drupal/cms` project at $_DRUPAL_CMS_TAG (default CMS_STABLE, '2.1.3' as
# of 2026-08-24), adds THIS package as a Composer path repository, and runs
# drupal_cms's own DrupalCmsCompatibilityTest against it
# (include.drupalci.main.yml:884-930). PROJECT_TYPE resolves to "recipe" because
# recipe.yml exists at the root (include.drupalci.main.yml:61-62).
################
  _AUTORUN_DRUPAL_CMS: 'all'
  # The Drupal core release CI installs. The CI templates' default ref (1.17.0)
  # sets 11.4.6, which cannot render a page once Composer resolves twig/twig
  # 3.30.0 (core issue 3625969); 11.4.8 carries the fix. Overriding the included
  # value redefines no upstream job. Remove it once the default ref's
  # CORE_STABLE is 11.4.8 or later: from then on it would hold CI back.
  CORE_STABLE: '11.4.8'


################
# Ágora-local job (T-221). This is the ONLY job defined by hand in this file,
# and it is permitted by the amended T-202 success criterion: the original
# criterion, "no job is defined by hand", would have left the eight - now nine -
# invariants in tests/bin/ running in no CI job at all, executing only when a
# human types them.
#
# The `include:` block above stays byte-identical to upstream. No upstream job
# is redefined, copied or overridden; this key is disjoint from every job
# `gitlab_templates` defines. Verified 2026-08-23 by PARSING the included files
# on `main` rather than assuming: include.drupalci.main.yml and
# include.drupalci.workflows.yml define 42 non-hidden job keys between them -
# composer and its 5 matrix variants, the 6 `deprecation - composer` variants,
# phpunit (+5), phpstan (+4), nightwatch (+5), composer-lint, phpcs, stylelint,
# eslint, cspell, twig-cs-fixer, `secret detection` AND `secret_detection`
# (upstream carries both spellings), pages, `Drupal CMS`, `test-only changes`,
# `upgrade status`, and `Pipeline set-up failed`. None is `agora-invariants`.
# Only 7 of the 42 actually ran in pipeline 933342; the rest are opt-in or
# skipped, which is precisely why a name must be disjoint from ALL of them and
# not merely from the ones observed running.
#
# WHICH UPSTREAM JOB WOULD OTHERWISE COVER THIS, AND WHY NONE DOES (a literal
# requirement of the amended T-202 criterion - the burden is to prove the local
# job is necessary, not merely convenient):
#   * `secret_detection` is the closest analogue, and only to ONE of the nine:
#     tests/bin/no-secrets. It is GitLab's own credential scanner over the git
#     history, it is opt-in (.skip-secret-detection-rule), and it knows nothing
#     about the recipe's config/ and content/ trees or Ágora's own patterns. It
#     covers none of the other eight.
#   * `composer-lint` runs `composer validate` and parallel-lint. That is JSON
#     and PHP syntax; no-unstable-deps, no-patches and sbom-check read
#     composer.json semantically (release stability, a forbidden `patches`
#     section, security-coverage status queried from updates.drupal.org).
#     A valid composer.json can violate all three.
#   * `phpunit` runs PHP test classes. The nine invariants are POSIX shell
#     scripts, not PHPUnit cases. RequirementsTest overlaps one rule
#     (no pinned/dev versions) and nothing else.
#   * `phpcs`, `phpstan`, `eslint`, `cspell`, `stylelint`, `twig-cs-fixer` lint
#     source files against language rules. None executes a repository script.
# No upstream job runs an arbitrary script from the project, so no upstream job
# can carry these checks. Hence exactly one local job, and no more.
################
agora-invariants:
  stage: validate
  # No dependency on the built environment: the invariants read the checked-out
  # working tree, not an installed Drupal. `needs: []` starts the job at once
  # and, more importantly, avoids naming an upstream job here.
  needs: []
  script:
    - cd $CI_PROJECT_DIR && pwd
    # Both runners must REACH the log. GitLab aborts a script at the first
    # non-zero line, so running them back to back would hide wave 3's
    # "N checks - M failures" line whenever wave 1 failed - and that summary
    # line is the evidence the gate exists (I-007: an exit code without counts
    # proves nothing). The exit status of each runner is therefore captured,
    # printed, and asserted below. This is not `allow_failure` and not
    # `|| true`: nothing is tolerated, the verdict is merely deferred by two
    # lines so that both denominators are on record.
    - RC_WAVE1=0; bash tests/bin/gate-a-wave1.sh || RC_WAVE1=$?
    - RC_WAVE3=0; bash tests/bin/gate-a-wave3.sh || RC_WAVE3=$?
    - echo "gate-a-wave1.sh exit=$RC_WAVE1 - gate-a-wave3.sh exit=$RC_WAVE3"
    - |
      if [ "$RC_WAVE1" -ne 0 ] || [ "$RC_WAVE3" -ne 0 ]; then
        echo "agora-invariants: FAILED - see the two summary lines above."
        exit 1
      fi
      echo "agora-invariants: both runners exited 0."


################
# Ágora-local job, D-040(2). A PostgreSQL variant of the upstream `phpunit`
# job. This is the SECOND and last job defined by hand in this file.
#
# WHY IT EXISTS. On 2026-08-27 this project's gate was green - nine jobs, all
# `success`, all blocking, 1951 assertions - while the front page's shipped
# query summed a text column. PostgreSQL refuses that outright; MariaDB
# returns 0 with a warning; SQLite returns 0.0 in silence. The assertions
# passed because nothing read the column, and no environment anyone opened was
# strict enough to complain. D-040(2) records the corollary: a job list is only
# as good as the environments it runs in, and this one ran MySQL because that
# is the upstream default, not because anyone chose it.
#
# NO UPSTREAM JOB IS REDEFINED, COPIED OR OVERRIDDEN. The `include:` block at
# the top of this file stays byte-identical to upstream, and `phpunit` itself
# is untouched - it still runs MySQL, so this ADDS a database rather than
# swapping one. The key below is disjoint from all 42 non-hidden job keys the
# included files define, re-parsed at source on 2026-08-27 the same way the
# agora-invariants comment above did it.
#
# THE MECHANISM IS UPSTREAM'S OWN, read at source on 2026-08-27 over
# https://git.drupalcode.org/project/gitlab_templates/-/raw/main/includes/
# rather than inferred from the names of the variables:
#   hidden-variables.yml:122   POSTGRESQL: 'pgsql'
#   hidden-variables.yml:190   CORE_PGSQL_MIN: '16' - the minimum PostgreSQL
#                              modern Drupal supports, and the version D-040
#                              actually measured the failure on (16.15)
#   variables.yml:43-50        _TARGET_DB_TYPE defaults to
#                              $MYSQL_PERCONA_MARIADB ('mysql') and
#                              _TARGET_DB_VERSION to $CORE_MYSQL_TEST_DEFAULT;
#                              both are documented there as overridable
#   main.yml:289               [[ $_TARGET_DB_TYPE == "pgsql" ]] && export
#                              SIMPLETEST_DB=pgsql://...@database/...
#   main.yml:12                the database service image is
#                              $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
#   main.yml:37-52             POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD
#                              and POSTGRES_TAG are already set for every
#                              testing job, so nothing about the service needs
#                              declaring here
# The image those two variables resolve to is
# .../drupalci-environments/pgsql-16:production, and db/pgsql-16 was confirmed
# to exist in project/drupalci_environments by listing that repository through
# the API - not assumed from the version number.
#
# WHY IT EXTENDS `.phpunit-base` AND NOT `phpunit`. Two reasons, and the second
# is mechanical rather than aesthetic. First, `phpunit:` is itself nothing but
# `extends: .phpunit-base` (main.yml:1696-1697), so this inherits precisely
# what the MySQL job inherits: the same three rules, the same `needs`, the same
# script and the same artifacts. Second, the literal line `extends: phpunit`
# would read to tests/bin/no-blind-phpunit as a bare phpunit command carrying
# no --fail-on-empty-test-suite, because its pattern matches the word followed
# by whitespace or end of line. That would be a false finding and a real red
# gate. The job's NAME dodges the same trap for the same reason: it is spelled
# with a hyphen instead of upstream's ` (variant)` style, so the word is never
# followed by a space.
#
# INHERITED AND DELIBERATELY NOT RESTATED: the three rules on `.phpunit-base`
# (main.yml:1671-1673) are the opt-in-current gate, the SKIP_PHPUNIT escape and
# the tests-exist check, whose terminal state is `when: on_success` with no
# failure tolerance declared anywhere in the chain. So this job is blocking,
# and it is blocking because upstream's own phpunit job is - not because a
# line here says so, which is a line somebody could later delete.
#
# --fail-on-empty-test-suite reaches this job through the global
# _PHPUNIT_EXTRA set at the top of this file. It is one variable read by the
# one shared script both jobs run, so the guard cannot be armed in one and
# missing in the other.
################
phpunit-pgsql:
  extends: .phpunit-base
  variables:
    _TARGET_DB_TYPE: $POSTGRESQL
    _TARGET_DB_VERSION: $CORE_PGSQL_MIN
  # THE GUARD BELOW IS NOT DECORATION, and it is the falsifiability of this
  # whole change. A job named for PostgreSQL that quietly ran on MySQL - a
  # variable-precedence surprise, a typo, an upstream rename - would pass, and
  # the gate would then carry a job whose name is a claim nothing ever checks.
  # That is D-040(2)'s own failure shape wearing a new label. So the job states
  # the environment it is about and refuses to run in the wrong one, BEFORE
  # spending the test stage in it: a green is a statement about the set it
  # opened, and the log has to name that set (I-007, I-045).
  #
  # This is the only place the resolved value is printed. main.yml:289 is
  # echoed verbatim into the trace of EVERY phpunit-family job, unexpanded, so
  # the string "SIMPLETEST_DB=pgsql://" appearing in a log proves nothing on
  # its own. `_TARGET_DB_TYPE=pgsql` read out of this job's own environment
  # does, and so does the runner's own "Starting service" line naming
  # pgsql-16:production.
  #
  # Nothing upstream defines before_script - checked across all three included
  # files on 2026-08-27 - so this clobbers no inherited step.
  before_script:
    - echo "database under test - _TARGET_DB_TYPE=$_TARGET_DB_TYPE - _TARGET_DB_VERSION=$_TARGET_DB_VERSION"
    - echo "service image - $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG"
    - |
      if [ "$_TARGET_DB_TYPE" != "pgsql" ]; then
        echo "FATAL: this job is named for PostgreSQL and _TARGET_DB_TYPE is '$_TARGET_DB_TYPE'."
        echo "Refusing to report a green PostgreSQL run that did not use PostgreSQL (D-040(2))."
        exit 1
      fi
