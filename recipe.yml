# The visible title of the site template, as shown in the Drupal CMS installer.
name: Ágora Transparency
# Kept byte-identical to the Drupal.org project title (D-021), so that a user who
# reads this string in the installer can find the project by searching for it.
# Do not shorten it: the bare word "Ágora" is a different, dormant 2019 project
# (drupal.org/project/agora), and Drupal.org's name check treats the two as one.

# A short description that will be visible in the Drupal CMS installer.
description: 'A transparency and open government site template for Drupal CMS, for councils, public bodies and organisations that publish accountability information. In development — see README.md for what is implemented today.'

# All site templates must have the `Site` type (case-sensitive); don't change this.
type: Site

# -----------------------------------------------------------------------------
# Functional areas · seam convention (D-011 rider b, plan.md §2)
#
# Ágora is ONE recipe at the repository root; there is no `recipes/` directory
# with local sub-recipes. The modularity is by FUNCTIONAL AREA, not by directory:
# every area occupies a contiguous block labelled `# -- area: <name> --` inside
# each of the three sections below (`recipes:`, `install:`, `config.actions`),
# and every identifier Ágora owns is prefixed with its area
# (`agora_base_*`, `agora_publishing_*`, `agora_foi_*`, `agora_ai_*`,
# `agora_governance_*`).
#
# The point of the convention: when these areas are extracted into standalone
# contrib recipes for the future paid template, extraction is MOVING lines, not
# rewriting them.
#
# Guardrail for that extraction: none of the extracted recipes may themselves
# declare `type: Site` — a site template built on another site template.
# Confirmed 2026-08-22, independently, in both the upstream recipe this
# repository was copied from (T-101) and the Drupal.org site-templates RFC
# (issue 3534752), which phrases it as a SHOULD-NOT design choice — site
# templates stay comprehensive and opinionated, not composable — rather than
# a rule enforced by the installer's own mechanics.
#
#   base        content model, taxonomies, roles and permissions     unit 002
#   publishing  editorial workflow with ECA                          unit 004
#   foi         freedom-of-information requests (Webform + ECA)      unit 004
#   ai          cited assistant over the document corpus             unit 005
#   governance  Config Guardian, scheduled snapshots                 unit 005
#
# Areas with nothing to contribute yet keep their label, so the block that owns
# them already exists when their unit arrives.
# -----------------------------------------------------------------------------

# Recipes to apply before this one.
recipes:
  # -- area: base ---------------------------------------------------------------
  #
  # ### Recommended recipes from Drupal core:
  #
  # Defines a generic administrator role, with all permissions.
  - core/recipes/administrator_role
  # Installs recommended core modules to help with site maintenance.
  - core/recipes/core_recommended_maintenance
  # Installs recommended core modules to boost Drupal's performance.
  - core/recipes/core_recommended_performance
  #
  # ### Recommended recipes from Drupal CMS:
  #
  # Sets up the administrative backend, with a nice theme and useful modules
  # providing helpful site management functionality.
  - drupal_cms_admin_ui
  # Basic anti-spam protection.
  - drupal_cms_anti_spam
  # Useful tweaks to user authentication.
  - drupal_cms_authentication
  # A set of basic media types and configuration.
  - drupal_cms_media
  # Basic privacy and consent management tools.
  - drupal_cms_privacy_basic
  # Basic SEO tools and configuration.
  - drupal_cms_seo_basic
  # Configures Drupal to send nice-looking HTML emails.
  - easy_email_express
  # -- area: publishing ---------------------------------------------------------
  # (empty in v1; filled by unit 004 — editorial workflow with ECA)
  # -- area: foi ----------------------------------------------------------------
  # (empty in v1; filled by unit 004 — freedom-of-information requests)
  # -- area: ai -----------------------------------------------------------------
  # (empty in v1; filled by unit 005 — cited assistant, degrades without an API key)
  # -- area: governance ---------------------------------------------------------
  # (empty in v1; filled by unit 005 — Config Guardian)

# A list of modules and themes to install.
install:
  # -- area: base ---------------------------------------------------------------
  # Provides useful tools for site template creators, and polyfills functionality that is not yet in Drupal core.
  - drupal_cms_helper
  # Core module. Supplies the `daterange` field type used by
  # `field.storage.node.field_agora_base_period` — the `periodo` of the three
  # financial regimes, which the law states as a start and an end, not as a
  # duration string. Hand-transplanted here per D-032 step 4b: enabling a module
  # is the one part of T-601 that `site:export` writes into its regenerated
  # `recipe.yml` instead of `config/`, so copying `config/` alone would have lost
  # it silently and the field storage would fail to import on a clean install.
  # Core, so it adds nothing to `composer.json` and needs no SBOM line.
  - datetime_range
  # Core module. The six per-bundle table views (T-615) are `views.view.*` config and
  # cannot import without it. It is ALREADY provided three times over by the declared
  # chain - `drupal_cms_media` and `drupal_cms_seo_basic` both install it, and
  # `drupal_cms_admin_ui` installs `views_ui` - so this line changes nothing today.
  # It is here because a transitive guarantee is a guarantee about somebody else's
  # recipe: the day one of those three drops it, our views fail to import and the
  # cause is three files away. Declared for the same reason `datetime_range` above is.
  # Core, so it adds nothing to `composer.json` and needs no SBOM line.
  - views
  # Core module. `config/user.role.agora_base_reviewer.yml` (T-602) declares a
  # dependency on it, because `view any unpublished content` — the one permission
  # that makes a reviewer something other than a weaker editor — is defined by
  # `content_moderation`, not by `node`. Without the module the role does not
  # import and a clean install loses it. Like `views` above it is ALREADY provided
  # by the declared chain (the upstream `content_editor` role and
  # `workflows.workflow.basic_editorial` both depend on it), so this line changes
  # nothing today; it is here because that is a guarantee about somebody else's
  # recipe. NOTE the scope: declaring the module is not putting Ágora's six bundles
  # under moderation — none of them is moderated, and the editorial workflow is
  # unit 004's row, not this one.
  # Core, so it adds nothing to `composer.json` and needs no SBOM line.
  - content_moderation
  # Core module. `content/menu_link_content/` ships the six quick-access links
  # the home page places as cards, and `config/system.menu.agora-base-quick-
  # access.yml` is the menu they hang in. Without the module the entity type
  # does not exist, the six content files import nothing, and the home page's
  # first section is silently empty - the same shape of failure I-086 records
  # for config entities. Like `views` and `content_moderation` above it is
  # ALREADY provided by the declared chain (`drupal_cms_admin_ui` and
  # `drupal_cms_seo_basic` both pull it in), so this line changes nothing
  # today; it is here because a transitive guarantee is a guarantee about
  # somebody else's recipe.
  # Core, so it adds nothing to `composer.json` and needs no SBOM line.
  - menu_link_content
  # By default, Drupal installs Stark as the default theme. It must be listed here, at
  # least initially, to prevent bugs if it's not present. You can remove it later if you
  # want to; just uninstall it before exporting the site as a recipe.
  - stark
  # Ágora's own front-end theme. It lives in a SEPARATE Drupal.org project,
  # `drupal/agora_theme` (D-014, option B), and is declared in `composer.json`'s
  # `require` as `^1.0` — never bundled here, because a site template may contain
  # no extension code of its own: the package ships zero `*.info.yml` files and is
  # installed outside the docroot, where Drupal does not even scan for extensions.
  # Composer therefore places the theme in the docroot and this line enables it;
  # `system.theme` below makes it the default.
  # The caret is what carries the theme's later releases into new installs, which
  # is the only update path a site template has: recipes apply once.
  - agora_theme
  # -- area: publishing ---------------------------------------------------------
  # (empty in v1; filled by unit 004)
  # -- area: foi ----------------------------------------------------------------
  # (empty in v1; filled by unit 004)
  # -- area: ai -----------------------------------------------------------------
  # (empty in v1; filled by unit 005)
  # -- area: governance ---------------------------------------------------------
  # (empty in v1; filled by unit 005)

config:
  # Ensures that this recipe will not conflict with any existing configuration. In
  # other words, if this recipe supplies configuration that a site already has, the
  # existing configuration will "win" and be left alone. Don't change this unless you
  # know what you're doing; most site templates provide configuration that will break
  # at install time if you change this.
  strict: false

  # -- the theme's own block placements, and they are NOT optional to name here --
  #
  # WITHOUT THESE FOUR LINES THE THEME RENDERS NO PAGE FURNITURE AT ALL: no page
  # title, no <h1>, no primary menu, no status messages. Measured on 2026-08-26 by
  # rendering a real installed site and counting, not by reading code.
  #
  # `drupal/agora_theme` ships them in its own `config/optional/`, and on a site
  # where the theme is enabled by hand — `drush theme:enable` — Drupal creates them
  # without being asked. **That is not the path this package takes.** A recipe
  # installs the theme through `RecipeRunner`, which sets the config installer to
  # SYNCING, and `ConfigInstaller::createConfiguration()` skips config ENTITIES
  # while syncing. A `block.block.*` is an entity. So they are silently not created,
  # the theme looks broken, and nothing fails.
  #
  # This is the same defect as I-074, which was found in `language.entity.*` the
  # night before and looked like a multilingual problem. It is not: it is every
  # config entity a recipe is expected to bring in. I-086 records the general form.
  #
  # Falsified before it was trusted, on a fresh database each time, on the rig:
  #   recipe as it was  -> `block.block.agora_theme_*` rows: NONE, pages h1=0
  #   with this block   -> all four created and named,       pages h1=1
  #
  # ⚠️ The names are listed ONE BY ONE on purpose. A wildcard would silently adopt
  # whatever the theme adds next, and a placement appearing on every installed site
  # because nobody removed it from a glob is not a decision anyone made.
  import:
    agora_theme:
      - block.block.agora_theme_page_title
      - block.block.agora_theme_content
      - block.block.agora_theme_main_menu
      - block.block.agora_theme_messages
      # THE FOUR BELOW ARE WHY A SITE INSTALLED FROM THIS PACKAGE HAD NO HEADER
      # BRANDING AND NO FOOTER AT ALL, and they were added on 2026-08-27 the day
      # theme 1.0.2 published them - not before, because a recipe importing a
      # config entity that its resolved release does not contain fails the
      # install outright. That ordering is the whole lesson: the theme ships the
      # placement, the release makes it resolvable, and only then may the recipe
      # name it.
      #
      # A recipe SKIPS config entities on install unless they are named here
      # (I-086). The four above were named; these four were not, so every clean
      # install - including the three that blanked the live preview while this
      # was being written - produced a site with no logo, no site name in the
      # masthead, no footer menu and no colophon. Nothing failed. The blocks
      # were simply never placed, which is the failure mode that looks like a
      # theme bug and is not one.
      - block.block.agora_theme_branding
      - block.block.agora_theme_footer_branding
      - block.block.agora_theme_footer_menu
      - block.block.agora_theme_powered_by
      # THE NINTH, added 2026-08-27 the day theme 1.0.3 published it. Same
      # ordering rule as the four above: the theme ships the placement, the
      # release makes it resolvable, and only then may the recipe name it.
      # It renders on every page except the front page, where core returns an
      # empty trail and the block does not render at all - which is correct: a
      # breadcrumb reading only "Home" on the home page is noise.
      - block.block.agora_theme_breadcrumb
  # -------------------------------------------------------------------------
  # AND FOUR PLACEMENTS THAT ARE NOT IN THAT LIST, ON PURPOSE.
  #
  # `config/block.block.agora_base_footer_*.yml` place four menus into the same
  # `footer` region as the nine above, and they are NOT named here because they
  # do not need to be: `import:` reaches config that some OTHER extension ships
  # in its own `config/optional`, which is the case I-086 is about. Config in
  # THIS recipe's own `config/` directory is applied by the recipe engine
  # directly - `system.menu.agora-base-quick-access`, the eight `views.view.*`
  # and the two `user.role.*` are all config ENTITIES living there and all get
  # created on a clean install. Naming them here would be naming an extension
  # that does not ship them.
  #
  # WHY THEY ARE HERE AND NOT IN THE THEME, which is the load-bearing half. A
  # block placement's only tie to a theme is its `theme:` key. Shipping them
  # from this package means the footer's contents are a decision the SITE
  # TEMPLATE makes - which is right, because the links point at routes this
  # package's own views create - and it means the theme needs no release before
  # the footer fills. The theme owns the five-column grid; this package owns
  # what stands in the columns.
  #
  # THE COLUMN HEADINGS ARE `label_display: visible`, unlike every placement in
  # the list above. Core's block--system-menu-block.html.twig renders a block
  # label as the <h2> that names the navigation landmark, and the theme already
  # carries a rule for it (`.agora-page__footer h2`) written, in its own words,
  # "so that a site placing four menus in the footer gets four column headings".
  # Hidden labels would leave four navigation landmarks in one <footer> that a
  # screen reader could not tell apart.

  actions:
    # -- area: base -------------------------------------------------------------
    # THE HOME PAGE, AND WHY THIS SAYS `/home` WHILE AN INSTALLED SITE REPORTS
    # `/page/1` (T-605, measured 2026-08-25 — the gap is cosmetic and
    # self-cancelling, not a bug, and it is written down because the next person
    # to notice it will otherwise "fix" it).
    #
    # `drupal_cms_helper`'s `RecipeSubscriber::onRecipeApplied()` deliberately
    # converts the alias declared here into its SYSTEM path when the recipe is
    # applied, so `system.site` `page.front` on a live site holds `/page/1`. The
    # export side is its mirror image: `GenericConfigurationListener` rewrites
    # `page.front` back to the alias, gated on a flag that only `SiteExporter`
    # switches on. The two are a ROUND-TRIP PAIR, and the alias itself survives
    # an export because it rides inside the landing page's own `path` field
    # rather than as a standalone `path_alias` entity.
    #
    # So the alias is declared, NOT the system path: `/page/1` is entity-ID
    # dependent, and `site:export` would rewrite it back to `/home` on every
    # export — declaring it would mean fighting the tool forever.
    #
    # Asserted end to end by `ValidationTest::testFrontPageRoundTrip()`. Note
    # what that test does NOT pin: the status `/home` answers with. A
    # DDEV-served install returns 301 to `/`; the same recipe under
    # BrowserTestBase returns a plain 200. The difference is the contributed
    # `redirect` module's route normalizer, which fires only when
    # `RedirectChecker::canRedirect()` passes, and that depends on how the
    # site is being served rather than on anything declared here.
    system.site:
      simpleConfigUpdate:
        page.front: '/home'
        # THE COLOPHON'S SECOND LINE, AND IT EXISTS BECAUSE A BLOCK ALREADY ASKED
        # FOR IT. `block.block.agora_theme_footer_branding` - one of the nine
        # placements imported above - ships `use_site_slogan: true`, and Drupal
        # installs with the slogan EMPTY, so up to here the footer's first column
        # was a site name and nothing else. The theme even styles the line
        # (`.agora-page__footer .agora-branding__slogan { max-width: 28ch }`, a
        # measure written for ONE line); it was styling an element that never
        # rendered.
        #
        # AND IT RENDERS TWICE, WHICH IS MEASURED RATHER THAN INTENDED HERE.
        # `block.block.agora_theme_branding` - the masthead, also in the list
        # above - ships `use_site_slogan: true` as well, and the theme styles
        # `.agora-branding__slogan` in both bands. So this one line appears under
        # the site name at the TOP of every page and again in the footer. That
        # is the theme's own design and both rules predate this action; it is
        # written down because setting one config key changed every page rather
        # than only the footer, and the next reader should not have to discover
        # that by looking.
        #
        # WHAT IT MAY AND MAY NOT SAY. This string ships to every site installed
        # from this template, under whatever name that site carries, so it has to
        # be true of a council, a public body and a foundation alike and it may
        # not make a claim any gate would have to prove. "Open government
        # information" names what the portal holds; it is not a motto and it does
        # not promise completeness, timeliness or compliance.
        #
        # ASCII ONLY, like every other string this package ships (D-033):
        # `tests/bin/config-inventory` prints `objects carrying a byte above
        # 0x7F: 2` and this line must not move that count.
        #
        # A SITE OWNER CHANGES IT IN ONE FIELD, at /admin/config/system/site-
        # information, which is the reason a slogan is the right home for the
        # line rather than anything drawn in a template.
        slogan: 'Open government information'
    # The default theme is Ágora's own, installed just above. Setting it here rather
    # than leaving the site on a core theme is the whole point of the swap: a
    # transparency portal whose tables and forms are the content needs the tokens,
    # the focus styles and the table semantics the theme carries.
    system.theme:
      simpleConfigUpdate:
        default: 'agora_theme'
    # -------------------------------------------------------------------------
    # CANVAS COMPONENTS (T-604). Disabling does not delete a component; it keeps
    # it out of the Canvas UI, so an editor building a page is not offered it.
    #
    # THE REVIEW THIS ROW ASKED FOR, and its one finding. Every component the
    # starter kit inherited into this list is an ADMIN surface — the toolbar,
    # the dashboard, the module installer, the editorial queues. Checked
    # component by component against its provider on a clean install, and the
    # reasons below are the result. The list was missing exactly one: core's
    # `navigation` module ships TWO single-directory components from the same
    # directory, `title` and `message`, and the inherited list disabled `title`
    # while leaving `message` enabled. `message` is added below.
    #
    # THE `?` PREFIXES ARE GONE, and that is a deliberate, measured change.
    # A `?` means "apply if present, SILENTLY skip if not" — no API reports what
    # was skipped, so a `?` that is never needed is a permanent blind spot: the
    # day an upstream module stops shipping one of these, the component quietly
    # comes back into the palette and nothing says so. All 16 `?`-prefixed names
    # were resolved against a clean install carrying this template's exact
    # dependency closure: 16 exist, 0 absent. An unnecessary `?` is therefore
    # dropped, which converts that silent regression into a loud failure at
    # apply time. `tests/bin/config-inventory` prints the count that was
    # inspected; `ValidationTest::testCanvasComponentReview()` is what fails if
    # one of these names stops resolving.
    #
    # The one name that keeps a wildcard is `project_browser_block.*`: it stands
    # for six per-source blocks, and the wildcard is resolved by the recipe
    # engine rather than being an optionality marker.
    # -------------------------------------------------------------------------
    # Drupal.org announcements, shown to administrators. Not page content.
    canvas.component.block.announce_block:
      disable: []
    # Scaffolding for the administrative dashboard.
    canvas.component.block.dashboard_placeholder:
      disable: []
    # The administrative dashboard's site status report.
    canvas.component.block.dashboard_site_status:
      disable: []
    # Administrative action links ("Add content"), placed by the admin theme.
    canvas.component.block.local_actions_block:
      disable: []
    # The administrative tab strip (View / Edit / Delete), placed by the admin theme.
    canvas.component.block.local_tasks_block:
      disable: []
    # A link into the administrative dashboard.
    canvas.component.block.navigation_dashboard:
      disable: []
    # An administrative toolbar link.
    canvas.component.block.navigation_link:
      disable: []
    # The administrative toolbar's shortcuts.
    canvas.component.block.navigation_shortcuts:
      disable: []
    # The administrative toolbar's user menu.
    canvas.component.block.navigation_user:
      disable: []
    # The module and recipe installer UI. The wildcard covers all six sources.
    canvas.component.block.project_browser_block.*:
      disable: []
    # The administration menu.
    canvas.component.block.system_menu_block.admin:
      disable: []
    # The administrative user-links menu.
    canvas.component.block.system_menu_block.navigation-user-links:
      disable: []
    # The administrative tools menu.
    canvas.component.block.system_menu_block.tools:
      disable: []
    # The administrative top-tasks menu.
    canvas.component.block.system_menu_block.top-tasks:
      disable: []
    # Status and error messages. The page template places these; an editor
    # positioning them by hand is how a form error ends up somewhere nobody looks.
    canvas.component.block.system_messages_block:
      disable: []
    # An editorial queue: content currently in draft. Belongs on a dashboard.
    canvas.component.block.views_block.publishing_content-block_drafts:
      disable: []
    # An editorial queue: content scheduled for publication. Belongs on a dashboard.
    canvas.component.block.views_block.publishing_content-block_scheduled:
      disable: []
    # An administrative dashboard listing of recently edited pages.
    canvas.component.block.views_block.recent_pages-block_recent_pages:
      disable: []
    # Administrative navigation chrome, from core's `navigation` module.
    canvas.component.sdc.navigation.title:
      disable: []
    # ADDED BY THIS REVIEW (T-604). The sibling of the component above, from the
    # same directory in core's `navigation` module, and administrative chrome for
    # the same reason — it renders a status/warning/error strip for the toolbar,
    # not page content. Core additionally marks it `status: experimental`, which
    # is not something to hand an editor in a page-building palette.
    canvas.component.sdc.navigation.message:
      disable: []
    # Drupal community events, from a contributed events module. A transparency
    # portal publishes its own records, not the Drupal event calendar.
    canvas.component.block.events_block:
      disable: []
    # -------------------------------------------------------------------------
    # THE ONE COMPONENT THIS TEMPLATE ENABLES RATHER THAN DISABLES, and it is
    # here because Canvas creates it in the OPPOSITE state to the others.
    #
    # Canvas mints a component for every menu the site gains, and it mints menu
    # components with `status: false` while it mints view-block components with
    # `status: true`. Measured on a clean install, not assumed: after applying
    # this recipe, `canvas.component.block.system_menu_block.agora-base-quick-
    # access` read back `status: false` while the six `views_block` components
    # beside it read `status: true`.
    #
    # ⚠️ SHIPPING THE FILE WITH `status: true` IS NOT ENOUGH, which is the part
    # worth writing down. `config.strict` above is `false`, so config that
    # already exists WINS and ours is skipped - and Canvas creates this one the
    # moment `system.menu.agora-base-quick-access` is saved, which is inside
    # the same config import. The shipped file is therefore a statement of
    # intent that may never be applied; this action is what actually applies
    # it. Both are kept: the file so the object is complete if it is created
    # from it, the action so the state is right when it is not.
    #
    # WHAT BEING DISABLED WOULD COST. A disabled component still renders where
    # a page already references it, so the home page would look correct - and
    # the component would be missing from the Canvas palette, so a site owner
    # could never place the quick-access cards on a second page. That is a
    # failure nothing on the home page can show.
    canvas.component.block.system_menu_block.agora-base-quick-access:
      enable: []
    # -------------------------------------------------------------------------
    # EVERY PUBLISHED FILE GETS A DESCRIPTION BOX, and it is the accessible name
    # of the download link rather than a caption beside it.
    #
    # Core's `GenericFileFormatter` passes the file item's `description` to
    # `file_link`, which uses it as the ANCHOR'S OWN TEXT when it is set and
    # falls back to the bare filename when it is not. So the description is what
    # a screen reader announces for the link — `Annual accounts 2022, PDF, 1,789
    # bytes` instead of `accounts-2022.pdf` — and the size stops living in a
    # sibling `<span>` that is read as separate content.
    #
    # This is the SAME KEY T-1104 turned on for the dataset distribution field,
    # applied to the other file surface this template publishes. The difference
    # is whose config it is: the distribution field is this package's own, and
    # `field_media_document` belongs to core's `media` module, so it is reached
    # by an action instead of by shipping the object.
    #
    # ⚠️ THE RENDER ALREADY WORKS WITHOUT THIS LINE — the formatter reads the
    # item's description whatever the setting says. What the setting buys is the
    # ABILITY TO EDIT ONE: without it the demo would show descriptions that the
    # upload form gives a site owner no way to write. A template that ships a
    # state its own UI cannot reproduce teaches the wrong thing.
    #
    # `setSettings` merges (`$settings + $this->settings`), so the extensions,
    # the directory and the size cap the media module set are all preserved.
    # No `?` prefix: `drupal_cms_media` is in `recipes:` above, so the field
    # exists by the time actions run — and this file's own policy is that a `?`
    # nobody needs is a permanent blind spot.
    field.field.media.document.field_media_document:
      setSettings:
        description_field: true
    # -- area: publishing -------------------------------------------------------
    # (empty in v1; filled by unit 004)
    # -- area: foi --------------------------------------------------------------
    # (empty in v1; filled by unit 004)
    # -- area: ai ---------------------------------------------------------------
    # (empty in v1; filled by unit 005)
    # -- area: governance -------------------------------------------------------
    # (empty in v1; filled by unit 005)

extra:
  recipe_installer_kit:
    # Send users to the dashboard (provided by drupal_cms_admin_ui) after installation.
    finish_url: '/admin/dashboard/welcome'
